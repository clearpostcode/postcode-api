[project]
name = "clearpostcode"
version = "1.0.0"
description = "UK postcode API client: postcode lookup, validation, autocomplete, nearest, reverse geocoding, distance, council, ward and constituency. Standard library only."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "Clear Postcode", email = "hello@clearpostcode.co.uk" }]
keywords = ["postcode", "uk postcode", "postcode lookup", "postcode api", "postcode validation", "postcode autocomplete", "reverse geocode", "geocoding", "council", "ward", "constituency"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Operating System :: OS Independent",
  "Intended Audience :: Developers",
  "Topic :: Software Development :: Libraries",
  "Typing :: Typed",
]
dependencies = []

[project.urls]
Homepage = "https://clearpostcode.co.uk/developers"
Documentation = "https://clearpostcode.co.uk/developers/docs"
Repository = "https://github.com/clearpostcode/postcode-api"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.8", "mypy>=1.13"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/clearpostcode"]

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
strict = true
python_version = "3.12"
files = ["src", "tests", "smoke.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
